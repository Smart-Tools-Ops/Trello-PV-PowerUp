<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <title>Synchronisieren</title>
</head>
<body>
  <div class="wrap">
    <p class="intro" id="status">Einen Moment…</p>
    <div id="auth" style="display:none">
      <button id="authBtn" class="btn btn-primary">Trello-Zugriff erlauben</button>
    </div>
    <div id="confirm" style="display:none">
      <button id="apply" class="btn btn-primary">Trotzdem übernehmen</button>
      <button id="cancel" class="btn btn-ghost">Abbrechen</button>
    </div>
  </div>

<script src="./config.js"></script>
<script src="./sync.js"></script>
<script>
  var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: APP_NAME });
  var ctx = null, pluginId = null, theLink = null, pending = null;
  function set(m){ document.getElementById('status').textContent = m; }

  function begin(){
    if(!APP_KEY || APP_KEY.indexOf('HIER_DEINEN') === 0){
      set('Es ist noch kein Trello-API-Key in config.js eingetragen. Bitte den Key eintragen und config.js erneut hochladen.');
      return;
    }
    t.getRestApi().isAuthorized().then(function(ok){
      if(ok){ run(); }
      else {
        set('Für die Synchronisation muss der Zugriff auf dein Trello einmalig erlaubt werden.');
        document.getElementById('auth').style.display = 'block';
      }
    }).catch(function(e){ set('Fehler bei der Autorisierungsprüfung: ' + e.message); });
  }

  document.getElementById('authBtn').addEventListener('click', function(){
    set('Öffne Trello-Zugriffsfenster… (bitte im neuen Fenster bestätigen)');
    t.getRestApi().authorize({ scope:'read,write', expiration:'never' }).then(function(){
      document.getElementById('auth').style.display = 'none';
      run();
    }).catch(function(e){ set('Zugriff nicht erteilt: ' + e.message); });
  });

  function run(){
    set('Prüfe Verknüpfung…');
    pluginId = t.getContext().plugin;
    t.card('id','idBoard').then(function(card){
      ctx = card;
      return getLink(t, card.id);
    }).then(function(link){
      if(!link){ set('Diese Karte ist nicht (mehr) verknüpft.'); return; }
      theLink = link;
      return Promise.all([ getCore(t, ctx.id), getCore(t, link.partner) ]).then(function(cores){
        var cur = cores[0], par = cores[1];
        var curNewer = new Date(cur.dateLastActivity) >= new Date(par.dateLastActivity);
        var target   = curNewer ? par : cur;
        var targetId = curNewer ? link.partner : ctx.id;
        var lastSync = link.lastSyncAt ? new Date(link.lastSyncAt) : new Date(0);
        pending = { source: curNewer ? cur : par, target: target, targetId: targetId };
        var targetChanged = new Date(target.dateLastActivity) > lastSync;
        if(targetChanged){
          set('Achtung: Die zu überschreibende Karte wurde seit dem letzten Abgleich geändert. Wenn du fortfährst, gewinnt die neuere Version – Änderungen auf der anderen Karte können verloren gehen.');
          document.getElementById('confirm').style.display = 'block';
        } else {
          apply();
        }
      });
    }).catch(function(e){ set('Fehler: ' + e.message); });
  }

  document.getElementById('apply').addEventListener('click', function(){
    document.getElementById('confirm').style.display = 'none'; apply();
  });
  document.getElementById('cancel').addEventListener('click', function(){ t.closePopup(); });

  function apply(){
    set('Gleiche ab…');
    var p = pending;
    mapLabels(t, p.source.idLabels, p.source.idBoard, p.target.idBoard).then(function(tgtLabels){
      return applyCore(t, p.targetId, p.source, tgtLabels);
    }).then(function(){
      return Promise.all([ t.get('card','shared','projektdaten'), getRemoteForm(t, theLink.partner, pluginId) ]);
    }).then(function(forms){
      var mine = forms[0] || {}, partner = forms[1] || {};
      var mineT = mine._updatedAt || 0, partnerT = partner._updatedAt || 0;
      if(partnerT > mineT){
        return t.set('card','shared','projektdaten', partner).then(function(){ finish('Abgeglichen. Formulardaten der Partnerkarte übernommen.'); });
      } else if(mineT > partnerT){
        finish('Abgeglichen. Deine Formulardaten sind neuer – sie erscheinen auf der Partnerkarte, sobald dort abgeglichen wird.');
      } else {
        finish('Abgeglichen.');
      }
    }).catch(function(e){ set('Fehler beim Abgleich: ' + e.message); });
  }

  function finish(msg){
    var now = new Date().toISOString();
    setLink(t, ctx.id, { partner: theLink.partner, partnerBoard: theLink.partnerBoard, role: theLink.role, lastSyncAt: now });
    setLink(t, theLink.partner, { partner: ctx.id, partnerBoard: ctx.idBoard, role: (theLink.role==='origin'?'mirror':'origin'), lastSyncAt: now });
    t.set('card','shared','_synctouch', Date.now());
    set(msg + ' ✓');
    setTimeout(function(){ t.closePopup(); }, 1600);
  }

  begin();
</script>
</body>
</html>
